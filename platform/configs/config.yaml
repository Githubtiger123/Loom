# Loom 平台服务配置（默认值，进仓库）
#
# 覆盖顺序：本文件 < configs/config.local.yaml < 环境变量 < 命令行 flag
# 指定其他配置路径时，local 文件从该配置所在目录读取；--config="" 时不读取文件。
# 密码类信息不要写在这里，用环境变量注入：
#   LOOM_DB_DSN / LOOM_REDIS_PASSWORD / LOOM_MQ_URL / LOOM_ISTIO_INGRESS_PRINCIPAL

server:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 60s
  shutdown_timeout: 10s

# MySQL：必需。连不上就不启动——没有库就没有"谁有什么权限"的答案。
db:
  # 由 LOOM_DB_DSN 覆盖，示例：
  # user:pass@tcp(127.0.0.1:3306)/loom?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai
  dsn: ""
  max_open: 50
  max_idle: 10
  # 必须小于中间件/LB 的空闲超时，否则会拿到已被对端关闭的连接
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  ping_timeout: 3s

# Redis：可选缓存，故障时认证与权限直查 MySQL，不影响已有 Token 的持久记录。
redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  dial_timeout: 2s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 20

# RabbitMQ：一期关闭。sync/cron 都在进程内跑，没有必须走队列的场景；
# 打开后连接失败会直接拒绝启动，避免静默丢消息。
mq:
  enabled: false
  url: "amqp://guest:guest@127.0.0.1:5672/"
  exchange: "loom"
  prefetch: 10

k8s:
  cluster: default
  # 固定的 Profile 原生 owner，必须对应真实登录身份，不是业务负责人。
  infrastructure_owner: admin
  # 为空表示使用 Pod 内的 ServiceAccount（生产默认）
  # 本地开发填 kubeconfig 路径，或用 LOOM_K8S_KUBECONFIG 注入
  kubeconfig: ""
  # profile-controller 创建的 ResourceQuota 名，不要改
  quota_name: kf-resource-quota
  # Notebook Pod 使用的 SA，与 notebooks-v1 模板一致
  editor_service_account: default-editor

istio:
  # 这两项必须与本集群实际一致。写错不会报错，
  # 只会让所有成员的 AuthorizationPolicy 静默失效（表现为全部 403）
  ingress_principal: "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
  kfp_ui_principal: "cluster.local/ns/kubeflow/sa/ml-pipeline-ui"

identity:
  # 必须设置为真实身份提供方 issuer；为空时业务接口拒绝认证，不自动开户。
  issuer: ""
  subject_header: oidc-sub
  # 仅接受这些直接连接方注入的身份。生产改为可信网关的最小网段，并用 NetworkPolicy 隔离。
  # 网关必须先删除客户端同名头，再写入已验证的 userid/sub；不要信任 X-Forwarded-For。
  trusted_proxy_cidrs: ["127.0.0.1/32", "::1/128"]
  # 必须与 profile-controller 的 USERID_HEADER 一致
  userid_header: "kubeflow-userid"
  # 必须与 profile-controller 的 USERID_PREFIX 一致；GCP 场景是 accounts.google.com:
  userid_prefix: ""

# 本地认证显式开启，不与外部身份头同时放行。这里只给默认值，不含任何密钥。
# 启用前设置真实的 issuer/public_origin/signing_key；不要提交含真实密钥的环境配置。
# 已有外部身份不会因 issuer 相同邮箱或用户名而自动迁移成本地用户。
auth:
  enabled: false
  issuer: ""
  audience: loom-api
  public_origin: ""
  # 可选：承载 Notebook 的独立 HTTPS 主机；由平台 Bearer 建立同一 Access JWT Cookie，不带 Refresh。
  notebook_origin: ""
  access_ttl: 15m
  session_ttl: 360h

images:
  # 独立 Notebook 镜像目录；相对路径基于进程工作目录。
  # 可用 LOOM_IMAGES_PATH 覆盖；API/worker 启动时加载，修改后重启。
  path: "configs/images.yaml"

# 官方 KFP 适配器：业务 API 与独立 pipeline-worker 需使用同一份配置。
pipeline:
  # 复用官方 KFP v2 后端，执行角色使用 -cmd pipeline-worker；不改 Notebook worker。
  enabled: false
  # 官方 runtime backend 尚未装配，先保持关闭；启用后 worker 会明确拒绝启动。
  native_observer_enabled: false
  # 原生执行已改为官方内核框架，尚不能提交；不会回退到已删除的自研引擎。
  native_enabled: false
  # 待发布接入 Loom Runtime API 的运行时后，配置实际镜像@sha256:digest；不能用原版二进制冒充已接入。
  official_driver_image: ""
  official_launcher_image: ""
  official_pipeline_root: "s3://mlpipeline/loom-official"
  native_service_account: loom-pipeline-task
  native_parallelism: 4
  # 下列旧 native_* 资源/存储字段只为读取旧配置保留，不用于官方引擎就绪判定。
  native_cpu: "1"
  native_memory: 1Gi
  native_artifact_endpoint: minio-service.kubeflow.svc.cluster.local:9000
  native_artifact_bucket: mlpipeline
  native_artifact_region: us-east-1
  native_artifact_secret: loom-native-artifacts
  # 每个业务空间中供 Argo 写日志的 Secret，不是后端只读日志凭据。
  native_log_archive_secret: loom-native-logs
  native_artifact_insecure: true
  endpoint: "http://ml-pipeline.kubeflow.svc.cluster.local:8888"
  # 官方 MLMD 的 grpc-web 入口；部署命名不同请修改。留空时 DAG 仍可读静态结构和 KFP 状态，元数据明确标记未配置。
  metadata_endpoint: "http://metadata-envoy-service.kubeflow.svc.cluster.local:9090"
  # 需要鉴权的机器代理可挂载专用 token；为空时仅用于受网络策略保护的集群内 Envoy。
  metadata_token_file: ""
  # 由运维挂载面向 KFP 的 projected ServiceAccount token；不使用 Loom Access JWT。
  token_file: "/var/run/secrets/kfp/token"
  service_account: "default-editor"
  # 替换为实际桶；平台自动追加 namespace/实例 UUID，用户不能覆盖根路径。
  pipeline_root: "s3://mlpipeline/loom/pipelines"
  timeout: 15s
  poll_interval: 15s
  # 独立状态同步：不依赖原操作单/原用户权限；只观察 Loom 已管理的 Run。
  sync_interval: 5s
  terminal_sync_interval: 5m
  sync_concurrency: 2
  # 每个 pipeline-worker 进程的观测请求上限，不包括提交/停止/删除动作自身的 API 调用。
  sync_qps: 10

# 内置 KServe 执行器；启用后由独立 kserve-worker 管理 InferenceService CR。
kserve:
  enabled: false
  service_account: default-editor
  # 已存在并关联到上述 SA 的模型读取 Secret；只检查绑定，不读取密钥。
  storage_secret: ""
  deployment_mode: Standard
  poll_interval: 10s
  resync_interval: 5m
  sync_concurrency: 2
  sync_qps: 10

# 可选机器执行入口，与公网业务监听隔离；只接受 CA 验证并匹配固定证书指纹的客户端。
# Trainer 仍需外部适配器；启用内置 KFP/KServe 后不接受外部领取对应任务。
executor:
  enabled: false
  addr: ":8444"
  server_cert: ""
  server_key: ""
  client_ca: ""
  client_cert_sha256: []

# 只读离线日志；install 中 Argo 自动归档到同一 MinIO，无需额外上传 manifest。
# 安装集群并注入专用只读凭据后启用，详见 docs/log-archives.md。
# 不依赖 pipeline.enabled，不创建桶、不写数据库日志索引。
log_archive:
  enabled: false
  format: argo
  endpoint: "http://minio.kubeflow.svc.cluster.local:9000"
  bucket: "mlpipeline"
  prefix: "logs"
  region: "us-east-1"
  timeout: 15s
  # access_key / secret_key / session_token 通过 LOOM_LOG_ARCHIVE_* 环境变量注入。

artifact_store:
  # 普通可视化：指标只读 MLMD，报告/数据预览使用独立的产物只读账号。
  enabled: false
  endpoint: "http://minio.kubeflow.svc.cluster.local:9000"
  bucket: mlpipeline
  # 下级必须是 namespace；与 pipeline.pipeline_root 保持一致。
  prefix: loom/pipelines
  region: us-east-1
  timeout: 15s
  # access_key / secret_key / session_token 通过 LOOM_ARTIFACT_STORE_* 注入。

model_store:
  # API/worker 使用独立、仅能写 loom-models/* 的账号，不能复用产物只读账号。
  # 启用前需同时配置 artifact_store；KServe 使用独立的只读存储 Secret。
  enabled: false
  endpoint: "http://minio.kubeflow.svc.cluster.local:9000"
  bucket: mlpipeline
  prefix: loom-models
  region: us-east-1
  timeout: 30s
  # access_key / secret_key / session_token 通过 LOOM_MODEL_STORE_* 注入。

log:
  level: "info" # debug | info | warn | error
