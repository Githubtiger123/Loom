# 合并到 Loom API Deployment.spec.template.spec；不是独立可 apply 的资源。
# install.sh 创建 loom-artifact-store，只含产物只读凭据，不共享日志/任务/root 账号。
containers:
  - name: loom-api
    env:
      - name: LOOM_ARTIFACT_STORE_ENABLED
        value: "true"
      - name: LOOM_ARTIFACT_STORE_ENDPOINT
        value: http://minio.kubeflow.svc.cluster.local:9000
      - name: LOOM_ARTIFACT_STORE_BUCKET
        value: mlpipeline
      - name: LOOM_ARTIFACT_STORE_PREFIX
        value: loom/pipelines
      - name: LOOM_ARTIFACT_STORE_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: loom-artifact-store, key: accesskey}
      - name: LOOM_ARTIFACT_STORE_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: loom-artifact-store, key: secretkey}
