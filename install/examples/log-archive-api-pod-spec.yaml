# 合并到 Loom API Deployment.spec.template.spec；不是独立可 apply 的资源。
# install.sh 会在 loom-system 创建 loom-log-archive，只含日志只读账号。
containers:
  - name: loom-api
    env:
      - name: LOOM_LOG_ARCHIVE_ENABLED
        value: "true"
      - name: LOOM_LOG_ARCHIVE_FORMAT
        value: argo
      - name: LOOM_LOG_ARCHIVE_ENDPOINT
        value: http://minio.kubeflow.svc.cluster.local:9000
      - name: LOOM_LOG_ARCHIVE_BUCKET
        value: mlpipeline
      - name: LOOM_LOG_ARCHIVE_PREFIX
        value: logs
      - name: LOOM_LOG_ARCHIVE_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loom-log-archive
            key: accesskey
      - name: LOOM_LOG_ARCHIVE_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: loom-log-archive
            key: secretkey
