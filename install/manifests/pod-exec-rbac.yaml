# 高权限：API 角色的在线终端。默认不安装，由 rbac.pod_exec 显式开启。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-pod-exec
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-pod-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-pod-exec
subjects:
  - kind: ServiceAccount
    name: loom-api
    namespace: loom-system
