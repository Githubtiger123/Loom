    newTag: 2.18.0
  - name: ghcr.io/kubeflow/kfp-cache-server
    newName: ghcr.1ms.run/kubeflow/kfp-cache-server
    newTag: 2.18.0
  - name: ghcr.io/kubeflow/kfp-frontend
    newName: ghcr.1ms.run/kubeflow/kfp-frontend
    newTag: 2.18.0
  - name: ghcr.io/kubeflow/kfp-persistence-agent
    newName: ghcr.1ms.run/kubeflow/kfp-persistence-agent
    newTag: 2.18.0
  - name: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
