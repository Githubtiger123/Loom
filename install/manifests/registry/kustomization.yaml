  - name: gcr.io/tfx-oss-public/ml_metadata_store_server
    newName: gcr.1ms.run/tfx-oss-public/ml_metadata_store_server
    newTag: 1.14.0
  - name: quay.io/argoproj/workflow-controller
    newName: quay.1ms.run/argoproj/workflow-controller
    newTag: v4.1.6
  # netvark 为第三方重新分发来源，拉取成功不等于与官方二进制内容一致。
  - name: quay.io/minio/minio
