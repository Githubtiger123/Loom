# Loom 控制面镜像映射；19 个均使用用户已拉取成功的毫秒镜像地址。
# 不修改上游版本，不映射 Docker Hub、Notebook 镜像或训练/推理工作负载镜像。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: ghcr.io/kubeflow/dashboard/profile-controller
    newName: ghcr.1ms.run/kubeflow/dashboard/profile-controller
    newTag: v2.0.1
  - name: ghcr.io/kubeflow/notebooks/notebook-controller
    newName: ghcr.1ms.run/kubeflow/notebooks/notebook-controller
    newTag: v1.11.1
