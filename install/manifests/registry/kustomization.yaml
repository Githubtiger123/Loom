  - name: ghcr.io/kubeflow/kfp-metadata-writer
    newName: ghcr.1ms.run/kubeflow/kfp-metadata-writer
    newTag: 2.18.0
  - name: ghcr.io/kubeflow/kfp-metadata-envoy
    newName: ghcr.1ms.run/kubeflow/kfp-metadata-envoy
    newTag: 2.18.0
  # 使用用户实测的 tag；未校验镜像站是否保留上游 digest，不直接沿用。
  - name: ghcr.io/metacontroller/metacontroller
    newName: ghcr.1ms.run/metacontroller/metacontroller
    newTag: v4.17.6
