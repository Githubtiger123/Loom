# 修改域名，并事先在 istio-system 准备匹配域名的 TLS Secret。
# 仅 Notebook 入口；不开放官网静态资源、普通 API、KFP UI 或推理服务。
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: kubeflow-gateway
  namespace: kubeflow
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-notebooks
        protocol: HTTPS
      hosts: [notebooks.example.com]
      tls:
        mode: SIMPLE
        credentialName: loom-notebook-tls
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: loom-notebook-auth
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway
      istio: ingressgateway
  action: CUSTOM
  provider:
    name: loom-auth
  rules:
    - to:
        - operation:
            hosts: [notebooks.example.com]
            paths: [/notebook/*]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: loom-notebook-session
  namespace: loom-system
spec:
  hosts: [notebooks.example.com]
  gateways: [kubeflow/kubeflow-gateway]
  http:
    - match:
        - uri:
            exact: /api/v1/auth/notebook-session
          method:
            regex: POST|OPTIONS
      route:
        - destination:
            host: loom-api.loom-system.svc.cluster.local
            port:
              number: 8080
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: loom-api-from-gateway
  namespace: loom-system
spec:
  selector:
    matchLabels:
      app: loom-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            ports: ["8080"]
            paths: [/verify/*, /api/v1/auth/notebook-session]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: loom-api-mtls
  namespace: loom-system
spec:
  selector:
    matchLabels:
      app: loom-api
  mtls:
    mode: STRICT
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loom-api-from-gateway
  namespace: loom-system
spec:
  podSelector:
    matchLabels:
      app: loom-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istio-ingressgateway
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
