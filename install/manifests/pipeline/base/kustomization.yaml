apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../upstream/community-distribution/applications/pipeline/upstream/env/cert-manager/platform-agnostic-multi-user
components:
  - ../../registry
configMapGenerator:
  - name: loom-kfp-minio-hooks
    namespace: kubeflow
    files:
      - minio-profile-sync.py
patches:
  # executor 镜像是启动参数，不会由普通 images 映射替换。
  - patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: workflow-controller
      - op: test
        path: /spec/template/spec/containers/0/args/2
        value: --executor-image
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: quay.1ms.run/argoproj/argoexec:v4.1.6
    target:
      group: apps
      version: v1
      kind: Deployment
      name: workflow-controller
      namespace: kubeflow
  # 任务镜像由 API Server 环境变量传入，普通 images 映射不会替换这里。
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline
        namespace: kubeflow
      spec:
        template:
          spec:
            containers:
              - name: ml-pipeline-api-server
                env:
                  - name: V2_DRIVER_IMAGE
                    value: ghcr.m.daocloud.io/kubeflow/kfp-driver:2.18.0
                  - name: V2_LAUNCHER_IMAGE
                    value: ghcr.m.daocloud.io/kubeflow/kfp-launcher:2.18.0
  # 排除官方 SeaweedFS；不 prune、不删除已存在的旧实例或 PVC。
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: seaweedfs-pvc
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: seaweedfs
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: seaweedfs-service
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: networking.istio.io/v1alpha3
      kind: DestinationRule
      metadata:
        name: ml-pipeline-seaweedfs
        namespace: kubeflow
  - patch: |-
      - op: remove
        path: /rules
    target:
      kind: ClusterRole
      name: kubeflow-pipelines-(edit|view)
  # 单独应用 secrets.local.yaml，禁止带入上游空密码/默认密码。
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mysql-secret
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlpipeline-minio-artifact
        namespace: kubeflow
  - path: mysql.yaml
  - path: metadata-envoy.yaml
  - path: pipeline-config.yaml
  - path: minio-kfp.yaml
  - path: minio-profile-controller.yaml
  - patch: |-
      $patch: delete
      apiVersion: networking.istio.io/v1alpha3
      kind: VirtualService
      metadata:
        name: unused
    target:
      kind: VirtualService
