apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubeflow/community-distribution/applications/pipeline/upstream/env/cert-manager/platform-agnostic-multi-user?ref=96e316a80e257a9f645c7c1ee0e1a94b904dead7
patches:
  - patch: |-
      - op: remove
        path: /rules
    target:
      kind: ClusterRole
      name: kubeflow-pipelines-(edit|view)
  # 单独应用 secrets.local.yaml，禁止带入上游空密码/默认密码。
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mysql-secret
        namespace: kubeflow
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlpipeline-minio-artifact
        namespace: kubeflow
  - path: mysql.yaml
  - path: metadata-envoy.yaml
  - path: pipeline-config.yaml
  - patch: |-
      $patch: delete
      apiVersion: networking.istio.io/v1alpha3
      kind: VirtualService
      metadata:
        name: unused
    target:
      kind: VirtualService
