# 复制为 secrets.local.yaml，替换所有 REPLACE_ME；不要提交真实凭据。
# 与已有数据库/S3 的原凭据保持一致；apply Secret 不会修改已初始化数据库密码。
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: kubeflow
type: Opaque
stringData:
  username: root
  password: REPLACE_ME_MYSQL_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: mlpipeline-minio-artifact
  namespace: kubeflow
type: Opaque
stringData:
  accesskey: REPLACE_ME_S3_ACCESS_KEY
  secretkey: REPLACE_ME_S3_SECRET_KEY
