# 复制为 secrets.local.yaml，替换所有 REPLACE_ME；不要提交真实凭据。
# 新集群安装模板。已有 SeaweedFS/MinIO 必须人工迁移，不是在线切换工具。
# 四个 MinIO 用户名必须不同，账号 3–20 字符、密码 16–40 字符；不要给工作负载使用 root。
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: kubeflow
type: Opaque
stringData:
  username: root
  password: REPLACE_ME_MYSQL_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: mlpipeline-minio-artifact
  namespace: kubeflow
type: Opaque
stringData:
  accesskey: REPLACE_ME_S3_ACCESS_KEY
  secretkey: REPLACE_ME_S3_SECRET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: kubeflow
type: Opaque
stringData:
  accesskey: REPLACE_ME_MINIO_ROOT_USER
  secretkey: REPLACE_ME_MINIO_ROOT_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-log-reader
  namespace: kubeflow
type: Opaque
stringData:
  accesskey: REPLACE_ME_LOG_READER_USER
  secretkey: REPLACE_ME_LOG_READER_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-artifact-reader
  namespace: kubeflow
type: Opaque
stringData:
  accesskey: REPLACE_ME_ARTIFACT_READER_USER
  secretkey: REPLACE_ME_ARTIFACT_READER_PASSWORD
