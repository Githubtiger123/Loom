apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # 官方 v2.3.0 平台适配，内含 JobSet v0.12.0、RBAC 和原生 TLS webhook。
  - https://github.com/kubeflow/community-distribution/applications/trainer/overlays?ref=96e316a80e257a9f645c7c1ee0e1a94b904dead7
  - namespace.yaml
patches:
  # 将运行时目录延后到控制器和 webhook 就绪之后安装。
  - patch: |-
      $patch: delete
      apiVersion: trainer.kubeflow.org/v1alpha1
      kind: ClusterTrainingRuntime
      metadata:
        name: unused
    target:
      kind: ClusterTrainingRuntime
  # rules 由 Kubernetes 聚合控制器维护，SSA 不占用该字段。
  - patch: |-
      - op: remove
        path: /rules
    target:
      kind: ClusterRole
      name: kubeflow-trainer-admin
