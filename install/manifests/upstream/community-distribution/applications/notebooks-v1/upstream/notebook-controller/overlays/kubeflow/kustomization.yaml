# Source: kubeflow/community-distribution @ 96e316a80e257a9f645c7c1ee0e1a94b904dead7
# Local Kustomize structure; remote resource YAMLs use ghfast.top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: kubeflow
patchesStrategicMerge:
  - patches/remove-namespace.yaml
configMapGenerator:
  - name: config
    behavior: merge
    literals:
      - USE_ISTIO=true
      - ISTIO_GATEWAY=kubeflow/kubeflow-gateway
