# Source: kubeflow/community-distribution @ 96e316a80e257a9f645c7c1ee0e1a94b904dead7
# Local Kustomize structure; remote resource YAMLs use ghfast.top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow-system
resources:
  - https://ghfast.top/https://raw.githubusercontent.com/kubeflow/community-distribution/96e316a80e257a9f645c7c1ee0e1a94b904dead7/applications/trainer/upstream/overlays/manager/namespace.yaml
  - ../../base/crds
  - ../../base/manager
  - ../../base/rbac
  - ../../base/webhook
  - ../../third-party/jobset
images:
  - name: ghcr.io/kubeflow/trainer/trainer-controller-manager
    newTag: v2.3.0
secretGenerator:
  - name: kubeflow-trainer-webhook-cert
    namespace: kubeflow-system
    options:
      disableNameSuffixHash: true
configMapGenerator:
  - name: kubeflow-trainer-public
    literals:
      - kubeflow_trainer_version=v2.3.0
    options:
      disableNameSuffixHash: true
