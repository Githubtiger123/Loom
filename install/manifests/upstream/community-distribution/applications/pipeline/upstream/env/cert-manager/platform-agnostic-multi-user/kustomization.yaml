# Source: kubeflow/community-distribution @ 96e316a80e257a9f645c7c1ee0e1a94b904dead7
# Local Kustomize structure; remote resource YAMLs use ghfast.top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform-agnostic-multi-user
  - ../base
namespace: kubeflow
patches:
  - path: patches/delete.clusterrole.cache-deployer.yaml
  - path: patches/delete.crb.cache-deployer.yaml
  - path: patches/delete.deployment.cache-deployer.yaml
  - path: patches/delete.role.cache-deployer.yaml
  - path: patches/delete.rolebinding.cache-deployer.yaml
  - path: patches/delete.sa.cache-deployer.yaml
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--tls_cert_filename=tls.crt"
    target:
      kind: Deployment
      name: cache-server
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--tls_key_filename=tls.key"
    target:
      kind: Deployment
      name: cache-server
replacements:
  - source:
      kind: ConfigMap
      name: pipeline-install-config
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          name: kfp-cache-cert
        fieldPaths:
          - spec.dnsNames.1
          - spec.dnsNames.2
        options:
          delimiter: .
          index: 1
      - select:
          kind: MutatingWebhookConfiguration
          name: cache-webhook-kubeflow
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 0
      - select:
          kind: MutatingWebhookConfiguration
          name: cache-webhook-kubeflow
        fieldPaths:
          - webhooks.0.name
        options:
          delimiter: .
          index: 1
      - select:
          kind: MutatingWebhookConfiguration
          name: cache-webhook-kubeflow
        fieldPaths:
          - webhooks.0.clientConfig.service.namespace
