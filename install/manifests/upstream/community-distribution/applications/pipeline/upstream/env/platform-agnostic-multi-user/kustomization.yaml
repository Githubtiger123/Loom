# Source: kubeflow/community-distribution @ 96e316a80e257a9f645c7c1ee0e1a94b904dead7
# Local Kustomize structure; remote resource YAMLs use ghfast.top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../third-party/metacontroller/base
  - ../../base/installs/multi-user
  - ../../base/metadata/base
  - ../../base/metadata/options/istio
  - ../../third-party/argo/installs/cluster
  - ../../third-party/mysql/base
  - ../../third-party/mysql/options/istio
  - ../../third-party/seaweedfs/istio
namespace: kubeflow
labels:
  - includeSelectors: true
    pairs:
      application-crd-id: kubeflow-pipelines
replacements:
  - source:
      kind: ConfigMap
      name: pipeline-install-config
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ConfigMap
          name: workflow-controller-configmap
        fieldPaths:
          - data.artifactRepository
        options:
          delimiter: .
          index: 1
  - source:
      kind: ConfigMap
      name: pipeline-install-config
      fieldPath: data.bucketName
    targets:
      - select:
          kind: ConfigMap
          name: workflow-controller-configmap
        fieldPaths:
          - data.artifactRepository
        options:
          delimiter: "\""
          index: 3
