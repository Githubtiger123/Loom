apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow
resources:
  - ../upstream/community-distribution/applications/dashboard/upstream/profile-controller/base
components:
  - ../registry
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: profiles-system
configMapGenerator:
  - name: profiles-config
    behavior: replace
    envs: [params.env]
  - name: profiles-namespace-labels-data
    behavior: replace
    files: [namespace-labels.yaml]
replacements:
  - source:
      kind: ServiceAccount
      name: profiles-controller-service-account
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ClusterRoleBinding
          name: profiles-cluster-rolebinding
        fieldPaths: ['subjects.[kind=ServiceAccount].namespace']
      - select:
          kind: RoleBinding
          name: profiles-leader-election-rolebinding
        fieldPaths: ['subjects.[kind=ServiceAccount].namespace']
