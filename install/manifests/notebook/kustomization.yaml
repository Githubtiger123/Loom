apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../upstream/community-distribution/applications/notebooks-v1/upstream/notebook-controller/overlays/kubeflow
components:
  - ../registry
configMapGenerator:
  - name: notebook-controller-config
    namespace: kubeflow
    behavior: merge
    envs: [params.env]
patches:
  - patch: |-
      - op: remove
        path: /rules
    target:
      kind: ClusterRole
      name: (notebook-controller-)?kubeflow-notebooks-admin
