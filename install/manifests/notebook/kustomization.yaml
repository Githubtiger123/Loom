apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubeflow/community-distribution/applications/notebooks-v1/upstream/notebook-controller/overlays/kubeflow?ref=96e316a80e257a9f645c7c1ee0e1a94b904dead7
configMapGenerator:
  - name: notebook-controller-config
    behavior: merge
    envs: [params.env]
patches:
  - patch: |-
      - op: remove
        path: /rules
    target:
      kind: ClusterRole
      name: (notebook-controller-)?kubeflow-notebooks-admin
