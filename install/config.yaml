# 复制为 config.local.yaml 修改；真实配置和生成的凭据不要提交。
# 所有相对路径相对于本配置文件所在目录。
installation: loom
context: "" # 必填：kubectl config get-contexts 中明确选择的 context，不自动用当前 context
timeout_seconds: 600
source:
  # 留空：优先使用当前工作区 ../../community-distribution，否则下载锁定 commit。
  # 离线安装填已有源码目录；必须是锁定 commit、无修改的 Git checkout。
  local_dir: ""
components:
  # Profile + Notebook v1 始终安装，不使用 Notebook v2 的 Workspace CR。
  cert_manager: install # install / reuse（已有同版本 cert-manager 时显式选择 reuse）
  istio: install # install / reuse；reuse 时本脚本不修改已有 mesh 配置
  pipeline: false # KFP API + Argo + MLMD + MySQL + SeaweedFS，不是第二套用户中心
  kserve: false # Standard 模式，不安装 Knative
notebook:
  host: notebooks.example.com # 与 Loom auth.notebook_origin 的 hostname 保持一致
identity:
  userid_header: kubeflow-userid
  userid_prefix: ""
rbac:
  pod_exec: false # 显式开启在线终端权限；同时仍受 Loom 业务权限检查
  space_delete_inventory: false # 全 API list，包括 Secret；见 README 的高权限说明
gateway:
  # 默认不开放浏览器入口；先部署 Loom API 和 TLS Secret，再启用。
  # 当前脚本只接管新装 Istio 的 Notebook 入口，不修改复用的 Istio mesh。
  enabled: false
  service_type: ClusterIP # ClusterIP / LoadBalancer / NodePort
  tls_secret: loom-notebook-tls # 事先创建于 istio-system，kubernetes.io/tls 类型
  auth_service: loom-api.loom-system.svc.cluster.local
  auth_port: 8080
  # 仍需在 Loom 配置最小 trusted_proxy_cidrs，并限制内部 /verify 的网络来源。
