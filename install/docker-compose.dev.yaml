# 本地开发用的中间件（不含 K8s，平台连本地集群用 kubeconfig）
#
#   cd loom/install && docker compose -f docker-compose.dev.yaml up -d
#
# 版本与 技术选型.md 一致：MySQL 8.4 LTS / Redis 7.4 / RabbitMQ 4.1
# 生产不要用这套：密码、持久化、备份策略都不适合线上。

services:
  mysql:
    image: mysql:8.4
    container_name: loom-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loom
      MYSQL_USER: loom
      MYSQL_PASSWORD: loom
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO
      # 本地开发放大一点，避免压测时被 max_connections 卡住
      - --max_connections=500
    volumes:
      - loom-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: loom-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - loom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: loom-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # 管理界面 http://localhost:15672 （guest/guest）
    environment:
      RABBITMQ_DEFAULT_USER: loom
      RABBITMQ_DEFAULT_PASS: loom
      RABBITMQ_DEFAULT_VHOST: /loom
    volumes:
      - loom-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  loom-mysql-data:
  loom-redis-data:
  loom-rabbitmq-data:
