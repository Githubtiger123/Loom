root = "/workspace/platform"
tmp_dir = "/tmp/air"

[build]
cmd = "go build -o /tmp/air/loom-platform ./cmd/platform"
bin = "/tmp/air/loom-platform"
include_ext = ["go", "yaml"]
exclude_dir = ["bin", "vendor"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
