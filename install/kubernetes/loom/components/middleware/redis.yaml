apiVersion: v1
kind: Service
metadata:
  name: loom-redis
  labels:
    app.kubernetes.io/name: loom-redis
    app.kubernetes.io/part-of: loom
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  selector:
    app.kubernetes.io/name: loom-redis
---
apiVersion: v1
kind: Service
metadata:
  name: loom-redis-headless
  labels:
    app.kubernetes.io/name: loom-redis
    app.kubernetes.io/part-of: loom
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  selector:
    app.kubernetes.io/name: loom-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loom-redis
  labels:
    app.kubernetes.io/name: loom-redis
    app.kubernetes.io/part-of: loom
spec:
  serviceName: loom-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-redis
        app.kubernetes.io/part-of: loom
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: docker.io/library/redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        command: [sh, -ec]
        args:
        - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: loom-middleware-config
              key: REDIS_PASSWORD
        startupProbe:
          exec:
            command: [sh, -ec, 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -qx PONG']
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          exec:
            command: [sh, -ec, 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -qx PONG']
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          exec:
            command: [sh, -ec, 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -qx PONG']
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
