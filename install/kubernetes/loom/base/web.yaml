# 静态前端和同源 API 代理。
apiVersion: v1
kind: Service
metadata:
  name: loom-web
spec:
  selector:
    app.kubernetes.io/name: loom-web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-web
        app.kubernetes.io/part-of: loom
    spec:
      serviceAccountName: loom-web
      containers:
      - name: web
        image: loom-web:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
