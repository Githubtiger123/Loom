# Loom 控制面公共资源。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loom-system
resources:
- namespace.yaml
- rbac.yaml
- migration-cronjob.yaml
- api.yaml
- workers.yaml
- web.yaml
configMapGenerator:
- name: loom-platform-config
  files:
  - config.yaml=config/config.yaml
  - config.local.yaml=config/config.local.example.yaml
  - images.yaml=config/images.yaml
