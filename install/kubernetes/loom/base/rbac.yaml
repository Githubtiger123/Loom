# 平台角色按 API、执行、观测和定时任务拆分。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-api
  namespace: loom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-worker
  namespace: loom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-sync
  namespace: loom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-cron
  namespace: loom-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-web
  namespace: loom-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-migrate
  namespace: loom-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-pipeline
  namespace: loom-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-kserve
  namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-resource-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, resourcequotas, persistentvolumeclaims, pods, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [kubeflow.org]
    resources: [profiles, notebooks]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [servingruntimes, clusterservingruntimes]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-resource-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-resource-reader
subjects:
  - kind: ServiceAccount
    name: loom-api
    namespace: loom-system
  - kind: ServiceAccount
    name: loom-worker
    namespace: loom-system
  - kind: ServiceAccount
    name: loom-sync
    namespace: loom-system
  - kind: ServiceAccount
    name: loom-kserve
    namespace: loom-system
  - kind: ServiceAccount
    name: loom-pipeline
    namespace: loom-system
---
# Only API inference needs services/proxy. Do not add this to the shared reader:
# proxy is workload invocation, not ordinary Kubernetes metadata access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-kserve-invoker
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-kserve-invoker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-kserve-invoker
subjects:
  - kind: ServiceAccount
    name: loom-api
    namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-profile-access-worker
rules:
  - apiGroups: [kubeflow.org]
    resources: [profiles, notebooks]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, resourcequotas]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kubeflow-edit, kubeflow-view]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, delete]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-profile-access-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-profile-access-worker
subjects:
  - kind: ServiceAccount
    name: loom-worker
    namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-pod-log-reader
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-pod-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-pod-log-reader
subjects:
  - kind: ServiceAccount
    name: loom-api
    namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-pipeline-client
rules:
  - apiGroups: [pipelines.kubeflow.org]
    resources: [pipelines, pipelineversions, experiments, runs]
    verbs: [get, list, create, update, delete, terminate, archive, unarchive, readArtifact, readLog]
  - apiGroups: [""]
    resources: [pods, events, namespaces, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-pipeline-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-pipeline-client
subjects:
  - kind: ServiceAccount
    name: loom-pipeline
    namespace: loom-system
  - kind: ServiceAccount
    name: loom-api
    namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-pipeline-observer
rules:
  # Watch is limited to the worker, not the API identity sharing read access.
  # Native writes belong only to the pipeline worker, never the API identity.
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [watch, create, patch, delete]
  # Official cache is persisted through Loom Runtime API, not ConfigMaps.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-pipeline-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-pipeline-observer
subjects:
  - kind: ServiceAccount
    name: loom-pipeline
    namespace: loom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-kserve-worker
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-kserve-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-kserve-worker
subjects:
  - kind: ServiceAccount
    name: loom-kserve
    namespace: loom-system
