# 常驻后台角色；ML worker 由 overlay 决定副本数。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-worker
        app.kubernetes.io/part-of: loom
    spec:
      serviceAccountName: loom-worker
      containers:
      - name: worker
        image: loom-platform:dev
        imagePullPolicy: IfNotPresent
        args: ["-config=/app/configs/config.yaml", "-cmd=worker", "-worker-concurrency=4"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: platform-config
          mountPath: /app/configs
          readOnly: true
      volumes:
      - name: platform-config
        configMap:
          name: loom-platform-config
---
