apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-pipeline-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-pipeline-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-pipeline-worker
        app.kubernetes.io/part-of: loom
    spec:
      serviceAccountName: loom-pipeline
      automountServiceAccountToken: false
      containers:
      - name: pipeline-worker
        image: loom-platform:dev
        imagePullPolicy: IfNotPresent
        args: ["-config=/app/configs/config.yaml", "-cmd=pipeline-worker", "-worker-concurrency=4"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: platform-config
          mountPath: /app/configs
          readOnly: true
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: kfp-token
          mountPath: /var/run/secrets/kfp
          readOnly: true
      volumes:
      - name: platform-config
        configMap:
          name: loom-platform-config
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: kfp-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: pipelines.kubeflow.org
              expirationSeconds: 3600
---
